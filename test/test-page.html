<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Gladiators Monitor Test Page</title>
  <style>
    body {font-family: Arial, sans-serif; margin: 20px;}
    .task {margin-top: 20px;}
  </style>
</head>
<body>
  <h2>Тестовая страница для Gladiators Battle Monitor</h2>
  <p>Эта страница имитирует страницу ожидания боя.</p>
  <button id="show-battle">Показать подготовку к бою</button>
  <script>
    document.getElementById('show-battle').addEventListener('click', () => {
      const div = document.createElement('div');
      div.className = 'task';
      div.innerHTML = `<div class="top"><div class="bottom"><div class="content">
        Подготовка к бою против <b><a href="/users/2">Botus</a> [25]</b>
        <b><a href="/builder/?id=227105591" style="color:#33F406">[настройки на бой]</a></b>
        Осталось: <span id="Timer">02:22</span>
      </div></div></div>`;
      document.body.appendChild(div);
    });
  </script>
</body>
</html>
